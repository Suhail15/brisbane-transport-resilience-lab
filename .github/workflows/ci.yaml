name: Verification
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
        env:
          RESILIENCE_DATA_DIR: data
      - name: Compose configuration
        if: runner.os == 'Linux'
        run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build when frontend exists
        shell: bash
        run: |
          if [ -f frontend/package-lock.json ]; then
            npm ci --prefix frontend
            npm run build --prefix frontend
          else
            echo 'Frontend is not implemented yet; no frontend build evidence claimed.'
          fi
